name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Ein neuer Push auf denselben Branch bricht den noch laufenden Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Typecheck, Lint, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests mit Coverage
        run: npm run test:coverage

      - name: Coverage-Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Die drei Playwright-Jobs teilen sich denselben Aufbau. Jeder baut die App
  # selbst (siehe webServer in playwright.config.ts) — mit der Mock-URL für
  # AniList eingebacken, deshalb lässt sich der Build nicht mit einem normalen
  # Produktions-Build teilen.
  e2e:
    name: E2E (Desktop + Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Playwright-Tests
        run: npm run e2e

      - name: Playwright-Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  accessibility:
    name: Barrierefreiheit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Barrierefreiheitstests
        run: npm run e2e:a11y

      - name: Playwright-Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 14
